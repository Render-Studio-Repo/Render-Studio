<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280" role="img" aria-label="Render Studio PC loading animation">
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="part" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="520" height="280" rx="24" fill="#050914"/>
  <rect x="24" y="28" width="300" height="224" rx="18" fill="url(#plate)" stroke="#334155" stroke-width="2"/>

  <rect x="54" y="52" width="240" height="14" rx="4" fill="#1e293b" stroke="#475569"/>
  <rect x="54" y="190" width="240" height="18" rx="4" fill="#0f172a" stroke="#334155"/>

  <rect x="160" y="48" width="42" height="22" rx="5" fill="#38bdf8"/>
  <rect x="176" y="70" width="10" height="70" rx="3" fill="url(#beam)"/>
  <rect x="150" y="150" width="48" height="40" rx="4" fill="url(#part)" stroke="#7dd3fc"/>

  <g transform="translate(320,40)">
    <circle cx="120" cy="90" r="14" fill="#1c1917" stroke="#fb923c" stroke-width="4"/>
    <g transform="rotate(-14 120 90)">
      <rect x="20" y="82" width="100" height="16" rx="6" fill="url(#arm)" stroke="#cbd5e1"/>
      <g transform="rotate(-90 28 90)">
        <rect x="-40" y="82" width="72" height="16" rx="6" fill="url(#arm)" stroke="#cbd5e1"/>
        <rect x="-58" y="70" width="18" height="8" rx="2" fill="#94a3b8"/>
        <rect x="-58" y="102" width="18" height="8" rx="2" fill="#94a3b8"/>
        <rect x="-52" y="84" width="16" height="12" rx="2" fill="url(#part)"/>
      </g>
    </g>
  </g>

  <text x="36" y="268" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    Render Studio — PC loading animation
  </text>
</svg>
