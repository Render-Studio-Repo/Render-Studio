[Service]
ExecStartPre=/home/ubuntu/scripts/cleanup-stale-render3d-processes.sh pre-start
ExecStart=
# Drain in-flight CAD generations on stop (matches RENDER3D_SHUTDOWN_DRAIN_SEC).
Environment=RENDER3D_SHUTDOWN_DRAIN_SEC=3600
ExecStart=/home/ubuntu/.venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8001 --workers 2 --timeout-keep-alive 5 --timeout-graceful-shutdown 3600 --timeout-worker-healthcheck 600
# Must be >= uvicorn graceful-shutdown or systemd SIGKILLs mid-drain.
TimeoutStopSec=3660
KillMode=mixed
KillSignal=SIGTERM
FinalKillSignal=SIGKILL
SendSIGKILL=yes
