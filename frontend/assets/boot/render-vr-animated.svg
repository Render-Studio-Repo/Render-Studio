<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 320" width="320" height="320">
  <title>Render VR loading animation</title>
  <defs>
    <linearGradient id="gearMetal" x1="10%" y1="4%" x2="92%" y2="96%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#e0f2fe"/>
      <stop offset="32%" stop-color="#7dd3fc"/>
      <stop offset="48%" stop-color="#f8fafc"/>
      <stop offset="64%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="chromeShine" x1="0%" y1="0%" x2="100%" y2="8%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#e0f2fe" stop-opacity="0.2"/>
      <stop offset="44%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="52%" stop-color="#67e8f9" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="logoPunch" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="1.55"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.18" intercept="0.03"/>
        <feFuncG type="linear" slope="1.14" intercept="0.025"/>
        <feFuncB type="linear" slope="1.28" intercept="0.05"/>
      </feComponentTransfer>
    </filter>
    <filter id="elecGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.35" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="markClip"><circle cx="160" cy="160" r="58"/></clipPath>
    <style>
      .grow { transform-origin: 160px 160px; animation: grow 4s ease-in-out infinite; }
      .spin { transform-origin: 160px 160px; animation: spin 3.2s linear infinite; }
      .shine { animation: shine 2.2s ease-in-out infinite; }
      .arc { stroke-dasharray: 12 28; animation: flow 0.85s linear infinite; }
      .spark { stroke-dasharray: 8 18; animation: flow 0.7s linear infinite; }
      @keyframes grow {
        0% { transform: scale(1); }
        75% { transform: scale(2); }
        100% { transform: scale(2); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes shine {
        0% { transform: translateX(-130px); opacity: 0; }
        16% { opacity: 1; }
        58% { transform: translateX(130px); opacity: 0; }
        100% { transform: translateX(130px); opacity: 0; }
      }
      @keyframes flow { to { stroke-dashoffset: -42; } }
      @media (prefers-reduced-motion: reduce) {
        .grow, .spin, .shine, .arc, .spark { animation: none !important; }
        .grow { transform: scale(1.15); }
        .shine { opacity: 0.55; transform: translateX(12px); }
      }
    </style>
  </defs>
  <g class="grow">
    <g class="spin" fill="url(#gearMetal)" stroke="#e0f2fe" stroke-width="1.35">
      <path d="M160 34l8.2 1.1 3.6 16.2 12.4-4.8 7.4 14.2 15.4.2 2.1 15.8 14.6 5.8-3.2 15.4 12.1 9.8-8.2 13.6 8.8 13.2-12.4 10.6 1.8 15.6-15.2 4.2-2.2 15.6-15.4.2-7.4 14.2-12.4-4.8-3.6 16.2L160 286l-8.2-1.1-3.6-16.2-12.4 4.8-7.4-14.2-15.4-.2-2.1-15.8-14.6-5.8 3.2-15.4-12.1-9.8 8.2-13.6-8.8-13.2 12.4-10.6-1.8-15.6 15.2-4.2 2.2-15.6 15.4-.2 7.4-14.2 12.4 4.8 3.6-16.2z"/>
      <circle cx="160" cy="160" r="58" fill="#070c14" stroke="#67e8f9" stroke-width="2.6"/>
    </g>
    <g clip-path="url(#markClip)">
      <image href="/media/images/render-animations/VR-Animations/render-logo-new-transparent.png?v=20260908-logo-ko1" xlink:href="/media/images/render-animations/VR-Animations/render-logo-new-transparent.png?v=20260908-logo-ko1" x="96" y="96" width="128" height="128" filter="url(#logoPunch)"/>
      <ellipse cx="146" cy="128" rx="28" ry="12" fill="#ffffff" opacity="0.38" style="mix-blend-mode:plus-lighter"/>
      <rect class="shine" x="96" y="96" width="42" height="128" fill="url(#chromeShine)" opacity="0.9" style="mix-blend-mode:plus-lighter"/>
      <g filter="url(#elecGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="arc" stroke="#ecfeff" stroke-width="1.85" d="M132 128 L126 148 L140 156 L132 176"/>
        <path class="arc" stroke="#67e8f9" stroke-width="1.7" d="M188 132 L176 144 L190 158 L178 170" style="animation-delay:-.2s"/>
        <path class="arc" stroke="#22d3ee" stroke-width="1.55" d="M148 196 L160 180 L170 198" style="animation-delay:-.45s"/>
        <path class="spark" stroke="#fb923c" stroke-width="1.8" d="M186 186 L198 176 L192 198 L208 190"/>
        <path class="spark" stroke="#fdba74" stroke-width="1.45" d="M172 204 L184 198 L178 214" style="animation-delay:-.3s"/>
      </g>
    </g>
  </g>
</svg>
