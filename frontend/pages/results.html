      <h2>Results</h2>

      <div id="res-meta"></div>

    </main>

  <script type="module">
    const data = await (await fetch("/docs/media/results-20260916.json")).json();
    document.getElementById("res-meta").textContent = `${data.count} rows · forgot then added: ${(data.forgot_then_added||[]).join(", ")} · hire ${data.hire}`;
    const tb = document.querySelector("#res-table tbody");
    (data.rows || []).slice(0, 80).forEach((r) => {
      const tr = document.createElement("tr");
      [r.agent, r.chat_id, r.instance_id, r.group_id, r.cycle_id, r.model].forEach((c) => {
        const td = document.createElement("td");
        td.textContent = c || "—";
        tr.append(td);
      });
      tb.append(tr);
    });
  </script>
