<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Render Studio · Chrome / Electric / Matrix</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#06080b; color:#e7edf5; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:28px 20px; }
    main { width:min(960px,100%); }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:0 8px 20px; }
    .brand { font-size:12px; font-weight:600; letter-spacing:.19em; }
    .edition { font:10px ui-monospace,monospace; color:#7e8a9c; letter-spacing:.13em; text-align:right; }
    .stage { position:relative; overflow:hidden; background:#030507; border:1px solid #192029; border-radius:16px; }
    canvas { display:block; width:100%; aspect-ratio:900/650; }
    .preview-label { position:absolute; top:22px; left:24px; color:#68808d; font:10px ui-monospace,monospace; letter-spacing:.13em; }
    .phase { position:absolute; top:22px; right:24px; color:#9baeba; font:10px ui-monospace,monospace; letter-spacing:.11em; }
    .controls { display:flex; align-items:center; gap:14px; margin-top:20px; padding:0 6px; }
    button { flex:0 0 auto; font:inherit; font-size:12px; color:#d5e4ec; border:1px solid #2c3742; border-radius:7px; background:#111820; padding:10px 15px; min-height:40px; cursor:pointer; }
    button:hover { background:#1a2732; border-color:#547081; }
    button:focus-visible, input:focus-visible { outline:2px solid #75e6ff; outline-offset:4px; }
    .timeline { flex:1; min-width:40px; accent-color:#8edff1; cursor:pointer; }
    .clock { min-width:72px; text-align:right; color:#a5b0be; font:11px ui-monospace,monospace; font-variant-numeric:tabular-nums; }
    .note { margin:17px 6px 0; color:#788694; font-size:12px; line-height:1.6; }
    @media (max-width:520px) { body {padding:20px 12px;} header {padding:0 3px 17px;} .brand {font-size:10px;letter-spacing:.1em;} .edition {font-size:9px;} .stage {border-radius:10px;} .preview-label,.phase {top:13px;font-size:8px;letter-spacing:.06em;} .preview-label {left:12px;} .phase {right:12px;} .controls {gap:8px;flex-wrap:wrap;} button {padding:10px 12px;min-height:44px;} .clock {min-width:66px;font-size:10px;} .note {font-size:11px;} }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">RENDER STUDIO</span><span class="edition">LOADING STUDY / 02</span></header>
    <section class="stage" aria-label="Chrome Render logo animation preview">
      <div class="preview-label">CHROME / ELECTRIC / MATRIX</div>
      <div class="phase" id="phase">01 — ENERGIZE</div>
      <canvas id="animation" width="900" height="650" role="img" aria-label="The chrome Render R sits in front of a rotating metal gear. Blue electricity flows along the logo and orange sparks fly from its lower edge. Green Matrix code falls inside the R near the end.">Chrome Render logo with electricity, a rotating gear, sparks, and a final Matrix code reveal.</canvas>
    </section>
    <div class="controls" aria-label="Animation preview controls">
      <button id="replay" type="button">Replay</button>
      <button id="pause" type="button" aria-label="Pause animation">Pause</button>
      <input class="timeline" id="timeline" type="range" min="0" max="8000" step="10" value="0" aria-label="Animation time in milliseconds">
      <output id="clock" class="clock" for="timeline">0.0 / 8.0s</output>
    </div>
    <p id="motion-note" class="note">An eight-second alternate loading sequence. Matrix rain enters during the final third.</p>
  </main>
  <script src="animation.js?v=20260908-chrome-electric-matrix-2"></script>
</body>
</html>
