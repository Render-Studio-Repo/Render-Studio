<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <rect width="520" height="320" rx="12" fill="#161b22"/>
  <text x="260" y="28" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Blink LED  wiring schematic</text>
  <!-- Arduino block -->
  <rect x="24" y="80" width="100" height="160" rx="6" fill="#00979d" stroke="#006d72" stroke-width="2"/>
  <text x="74" y="108" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Arduino</text>
  <text x="74" y="128" text-anchor="middle" fill="#c8ffff" font-size="9">Uno</text>
  <circle cx="40" cy="150" r="4" fill="#f85149"/><text x="52" y="154" fill="#fff" font-size="9">5V</text>
  <circle cx="40" cy="210" r="4" fill="#6e7681"/><text x="52" y="214" fill="#fff" font-size="9">GND</text>
  <circle cx="108" cy="150" r="4" fill="#58a6ff"/><text x="88" y="154" fill="#fff" font-size="9">D13</text>
  <!-- Breadboard -->
  <rect x="160" y="70" width="200" height="180" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <rect x="168" y="78" width="184" height="12" rx="2" fill="#f85149" opacity="0.35"/>
  <rect x="168" y="230" width="184" height="12" rx="2" fill="#6e7681" opacity="0.35"/>
  <text x="260" y="68" text-anchor="middle" fill="#8b949e" font-size="9">breadboard</text>
  <!-- Resistor -->
  <rect x="300" y="155" width="50" height="14" rx="3" fill="#d4a574"/>
  <text x="325" y="178" text-anchor="middle" fill="#8b949e" font-size="8">220�</text>
  <!-- LED -->
  <polygon points="390,160 410,150 410,170" fill="#3fb950"/>
  <line x1="410" y1="160" x2="430" y2="160" stroke="#3fb950" stroke-width="2"/>
  <line x1="380" y1="160" x2="390" y2="160" stroke="#3fb950" stroke-width="2"/>
  <text x="405" y="188" text-anchor="middle" fill="#8b949e" font-size="8">LED</text>
  <!-- Wires -->
  <path d="M44 150 H168" stroke="#f85149" stroke-width="2.5"/>
  <path d="M44 210 H168" stroke="#6e7681" stroke-width="2.5"/>
  <path d="M108 150 C 130 150, 130 130, 168 130" stroke="#58a6ff" stroke-width="2.5" fill="none"/>
  <path d="M168 130 H280" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M280 130 H300" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M350 162 H368" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M380 160 H368" stroke="#3fb950" stroke-width="2.5"/>
  <path d="M430 160 C 450 160, 450 236, 168 236" stroke="#6e7681" stroke-width="2.5" fill="none"/>
  <!-- Legend -->
  <rect x="440" y="88" width="68" height="88" rx="6" fill="#21262d" stroke="#30363d"/>
  <line x1="450" y1="104" x2="470" y2="104" stroke="#f85149" stroke-width="2"/><text x="476" y="108" fill="#8b949e" font-size="8">5V</text>
  <line x1="450" y1="120" x2="470" y2="120" stroke="#6e7681" stroke-width="2"/><text x="476" y="124" fill="#8b949e" font-size="8">GND</text>
  <line x1="450" y1="136" x2="470" y2="136" stroke="#58a6ff" stroke-width="2"/><text x="476" y="140" fill="#8b949e" font-size="8">Signal</text>
  <line x1="450" y1="152" x2="470" y2="152" stroke="#3fb950" stroke-width="2"/><text x="476" y="156" fill="#8b949e" font-size="8">LED +</text>
</svg>
